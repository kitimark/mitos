name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

# No concurrency group. A group cancels by arrival order, not by head: a re-run or a late-created
# run of an old head joined the PR's group and cancelled the current head's run (#97).
jobs:
  # A fork PR's token cannot cancel runs, so forks skip it and their old runs finish.
  cancel-superseded:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Cancel this branch's superseded runs, or only this run when the PR is closed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          CONFIRM_SECONDS: 10
        run: |
          # cancel-superseded-body
          set -euo pipefail
          read_unfinished_runs() {
            read -r wf own_head branch < <(gh api "repos/$REPO/actions/runs/$RUN_ID" \
              --jq '"\(.workflow_id) \(.head_sha) \(.head_branch)"')
            runs="$RUNNER_TEMP/unfinished-runs"
            gh api --paginate -X GET "repos/$REPO/actions/workflows/$wf/runs" \
              -f event=pull_request -f branch="$branch" -f per_page=100 \
              | jq -r --arg branch "$branch" --arg repo "$REPO" '.workflow_runs[]
                  | select(.status != "completed" and .event == "pull_request"
                      and .head_branch == $branch and .head_repository.full_name == $repo)
                  | "\(.id) \(.head_sha)"' > "$runs"
            echo "Unfinished runs of $branch (run id, head):"; cat "$runs"
          }
          read_pr_state_and_head() { gh api "repos/$REPO/pulls/$PR" --jq '"\(.state) \(.head.sha)"'; }
          read_unfinished_runs
          stale_runs() {
            awk -v h="$1" -v own="$own_head" '$2 != h { n++ } END { exit !(n || own != h) }' "$runs"
          }
          pr=$(read_pr_state_and_head); confirmed=
          for _ in 1 2 3; do
            if [ "${pr%% *}" = open ] && ! stale_runs "${pr#* }"; then
              echo "Every unfinished run is at the current head ${pr#* }."; exit 0
            fi
            sleep "$CONFIRM_SECONDS"
            next=$(read_pr_state_and_head)
            if [ "$next" = "$pr" ]; then confirmed=1; break; fi
            echo "The PR moved from $pr to $next between two reads; reading again."
            pr=$next
          done
          if [ -z "$confirmed" ]; then echo "::notice::The PR kept changing; no run cancelled."; exit 0; fi
          state=${pr%% *} head=${pr#* }

          cancel_when_pr_closed() {
            open_heads=$(gh api -X GET "repos/$REPO/pulls" -f state=open \
              -f head="${REPO%%/*}:$branch" -f per_page=100 --jq '.[].head.sha')
            if grep -qxF "$own_head" <<< "$open_heads"; then
              echo "PR #$PR is $state, and an open PR from $branch is at $own_head; this run goes on."
              exit 0
            fi
            echo "Cancel this run ($RUN_ID): PR #$PR is $state; no other run is judged."
            gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/cancel" --silent
            exit 0
          }
          not_started() {
            case "$1" in
              queued|pending|waiting|requested) ;;
              *) return 1 ;;
            esac
            [ "$2" -eq 0 ]
          }
          cancel_refusal_is_harmless() {
            local err="$1" id="$2" status jobs
            status=$(gh api "repos/$REPO/actions/runs/$id" --jq .status) || return 1
            # A run that finished after the listing cannot be cancelled any more.
            if [ "$status" = completed ]; then return 0; fi
            if [[ "$err" != *"has not been queued yet"* || "$err" != *"HTTP 409"* ]]; then
              return 1
            fi
            jobs=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq .total_count) || return 1
            if not_started "$status" "$jobs"; then
              echo "::notice::Run $id is not started (status $status, $jobs jobs). GitHub refused the cancel with HTTP 409. Leaving the run."
              return 0
            fi
            return 1
          }
          cancel_runs_whose_head_differs() {
            failed=0
            while read -r id sha <&3; do
              if [ "$sha" = "$head" ] || [ "$id" = "$RUN_ID" ]; then continue; fi
              echo "Cancel run $id: its head $sha is not the current head $head."
              if ! err=$(gh api -X POST "repos/$REPO/actions/runs/$id/cancel" --silent 2>&1); then
                printf '%s\n' "$err"
                if ! cancel_refusal_is_harmless "$err" "$id"; then failed=1; fi
              fi
            done 3< "$runs"
            if [ "$own_head" != "$head" ]; then
              echo "Cancel this run ($RUN_ID): its head $own_head is not the current head $head."
              gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/cancel" --silent
            fi
            exit "$failed"
          }
          if [ "$state" != open ]; then cancel_when_pr_closed; fi
          cancel_runs_whose_head_differs
          # end-cancel-superseded-body

  # Today's gate body, without the corpus and without the spec-label step.
  # #164 replaces the script-test steps in place. #168's setup action replaces
  # the inline elan, bubblewrap and cache steps. Only this job saves the Lean
  # cache, and only on a push to main, so a shard's smaller .lake cannot win
  # the save. #167's pin check is not here; it belongs on gate, first after
  # checkout, once that change lands.
  checks:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.action != 'labeled' &&
       github.event.action != 'unlabeled')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      LAKE_NO_CACHE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Neutral skill tree matches the roster
        run: python3 .cursor/skills/agents-skills.py check

      - name: pr-state.sh, watch-github.sh and the files they source run gh only as gh api in their wrappers, and never name GraphQL
        run: .claude/scripts/gh-api-rest.test.sh

      - name: hook-state.sh and origin-repo.sh name bash with a shebang
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          fi
          .claude/scripts/sourced-bash.test.sh

      - name: Every plan row that links an issue has a task file with a design, or is listed as pending
        run: .claude/scripts/plan-tasks.test.sh

      - name: Vendor checks reject changed bytes, imports and unsafe metadata
        run: .github/scripts/vendor-provenance.test.sh

      - name: Changed vendor bytes match their pinned upstream revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: .github/scripts/vendor-provenance.sh --if-changed

      - name: A never-started jobless run does not fail cancel-superseded
        run: .github/scripts/cancel-superseded.test.sh

      - name: Cached logs cannot reach this run
        run: .github/scripts/cache-logs.test.sh

      - name: The Lean cache key covers every manifest and toolchain
        run: .github/scripts/cache-key.test.sh

      - name: The Lean bump script keeps Mathlib on the candidate toolchain
        run: .github/scripts/bump-lean.test.sh

      - name: The cheat corpus is partitioned across the shard matrix
        run: .github/scripts/cheat-shard.test.sh

      - name: The spec-label check fails closed
        run: .github/scripts/ci-trust.test.sh


      # Restore on a pull request. Save on a push to main, which is the only
      # push this workflow runs. #168 turns this pair into the setup action.
      - uses: actions/cache/restore@v4
        if: github.event_name != 'push'
        with:
          path: |
            ~/.elan
            .lake
            core/.lake
            examples/acme/.lake
            eval/score/.lake
            eval/mutants/.lake
          key: lean-${{ hashFiles('core/lake-manifest.json', 'eval/diff/lake-manifest.json', 'eval/diff/lean-toolchain', 'eval/mutants/lake-manifest.json', 'eval/mutants/lean-toolchain', 'eval/score/lake-manifest.json', 'eval/score/lean-toolchain', 'examples/acme/lake-manifest.json', 'examples/acme/lean-toolchain', 'lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          restore-keys: lean-${{ hashFiles('core/lake-manifest.json', 'eval/diff/lake-manifest.json', 'eval/diff/lean-toolchain', 'eval/mutants/lake-manifest.json', 'eval/mutants/lean-toolchain', 'eval/score/lake-manifest.json', 'eval/score/lean-toolchain', 'examples/acme/lake-manifest.json', 'examples/acme/lean-toolchain', 'lake-manifest.json', 'lean-toolchain') }}-

      - uses: actions/cache@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: |
            ~/.elan
            .lake
            core/.lake
            examples/acme/.lake
            eval/score/.lake
            eval/mutants/.lake
          key: lean-${{ hashFiles('core/lake-manifest.json', 'eval/diff/lake-manifest.json', 'eval/diff/lean-toolchain', 'eval/mutants/lake-manifest.json', 'eval/mutants/lean-toolchain', 'eval/score/lake-manifest.json', 'eval/score/lean-toolchain', 'examples/acme/lake-manifest.json', 'examples/acme/lean-toolchain', 'lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          restore-keys: lean-${{ hashFiles('core/lake-manifest.json', 'eval/diff/lake-manifest.json', 'eval/diff/lean-toolchain', 'eval/mutants/lake-manifest.json', 'eval/mutants/lean-toolchain', 'eval/score/lake-manifest.json', 'eval/score/lean-toolchain', 'examples/acme/lake-manifest.json', 'examples/acme/lean-toolchain', 'lake-manifest.json', 'lean-toolchain') }}-

      # #168's setup action owns this rm. A restored .lake can hold another run's logs.
      - name: Drop restored cheat and mutant logs
        if: always()
        run: rm -rf .lake/cheats .lake/mutants

      - name: Install elan if the cache has none (pinned, checked, retried)
        run: .github/scripts/install-elan.sh

      - name: Cache key and folder of the pinned bubblewrap .deb
        id: bwrap
        run: .github/scripts/install-bubblewrap.sh --cache-key >> "$GITHUB_OUTPUT"

      - name: Restore the pinned bubblewrap .deb (saved at the end of a job that downloaded it)
        uses: actions/cache@v4
        with:
          path: ${{ steps.bwrap.outputs.dir }}
          key: ${{ steps.bwrap.outputs.key }}

      - name: Install bubblewrap (sandbox for lake comparator)
        run: |
          .github/scripts/install-bubblewrap.sh
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; bwrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install the Lean toolchains from lean-toolchain (retried; no download on a cache hit)
        run: .github/scripts/install-toolchains.sh

      - name: Build core and gate
        run: lake build

      - name: The protection reader's key reads only administration, and it pairs with land's decide
        run: .github/scripts/land-protection.test.sh
      - name: The merge re-reads and acts once at its planned head
        run: .github/scripts/land-apply.test.sh
      - name: The land report answers each change once
        run: .github/scripts/land-report.test.sh
      - name: Every app token is narrowed in trusted
        run: .github/scripts/app-token.test.sh

      - name: Make PyYAML available for the independent workflow parser
        run: |
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
          python3 -I -c 'import yaml; print(yaml.__version__)'

      - name: Gate suite execution records require complete current-tree coverage
        run: python3 -I .github/scripts/gate-tests.test.py

      - name: Compare every workflow with PyYAML
        run: gate/workflow-diff.sh

      - name: The gate binary does not need the toolchain at runtime
        run: |
          set -euo pipefail
          bin=.lake/build/bin/mitos-gate
          ldd "$bin" | tee /tmp/mitos-gate.ldd
          if grep -E 'not found|/\.elan/' /tmp/mitos-gate.ldd; then
            echo "::error::mitos-gate needs a Lean shared library; prove would have to build or pack one"
            exit 1
          fi
          # Strip a copy. The build output stays as Lake linked it, so a later
          # build in this job, and the cache saved on main, keep those bytes.
          strip -o "$RUNNER_TEMP/mitos-gate" "$bin"

      - name: Upload the gate binary for prove
        uses: actions/upload-artifact@v4
        with:
          name: mitos-gate-bin
          path: ${{ runner.temp }}/mitos-gate
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: land-decide.sh records each outcome and holds no key
        run: .github/scripts/land-decide.test.sh

      - name: Run-log day files match the base, one record per (task, role, attempt)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base "origin/$BASE_REF" HEAD)
            dir="$RUNNER_TEMP/runlog-base"
            rm -rf "$dir" && mkdir -p "$dir/ops/runs"
            if git cat-file -e "$base:ops/runs" 2>/dev/null; then
              git archive "$base" ops/runs | tar -x -C "$dir"
            fi
            lake exe mitos-gate runlog --base "$dir/ops/runs" --head ops/runs
          else
            lake exe mitos-gate runlog --head ops/runs
          fi

      - name: Import rule (core imports Init, Std, Mitos.*; the spec never imports implementations)
        run: lake exe mitos-gate imports

      - name: statements.lock header matches MitosGate.Lock.header
        run: gate/lock-header-test.sh

      - name: statements.lock matches the compiled core
        run: lake exe mitos-gate lock --check

      - name: Core has no sorry and only standard axioms (sandboxed kernel replay)
        run: cd core && lake check

      - name: Core implementation proves the approved Challenge
        run: |
          if [ -f core/Mitos/Proofs/Resolver.lean ]; then
            cd core && lake comparator --paranoid
          else
            echo "No implementation yet (core/Mitos/Proofs/Resolver.lean); Challenge not judged."
          fi

      - name: Example workspace builds
        run: cd examples/acme && lake build

      - name: Scorecard on the fixture (precision and recall per edge type against hand labels)
        run: |
          lake --dir eval/score build
          lake --dir eval/score exe mitos-score eval/fixtures/toy > "$RUNNER_TEMP/scorecard.md"
          cat "$RUNNER_TEMP/scorecard.md"
          cat "$RUNNER_TEMP/scorecard.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: ${{ runner.temp }}/scorecard.md

      - name: Honest toy plugin is accepted (gates 0-6, independent kernels)
        run: |
          lake exe mitos-gate accept --workspace examples/acme --plugin ToyRequire \
            --model Models.ToyRequire.model --paranoid

      - name: Model lint allowlist accepts and rejects each command kind
        run: lake exe mitos-lint-test

  gate-tests:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.action != 'labeled' &&
       github.event.action != 'unlabeled')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      LAKE_NO_CACHE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan
            .lake
            core/.lake
            examples/acme/.lake
            eval/score/.lake
            eval/mutants/.lake
          key: lean-${{ hashFiles('core/lake-manifest.json', 'eval/diff/lake-manifest.json', 'eval/diff/lean-toolchain', 'eval/mutants/lake-manifest.json', 'eval/mutants/lean-toolchain', 'eval/score/lake-manifest.json', 'eval/score/lean-toolchain', 'examples/acme/lake-manifest.json', 'examples/acme/lean-toolchain', 'lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          restore-keys: lean-${{ hashFiles('core/lake-manifest.json', 'eval/diff/lake-manifest.json', 'eval/diff/lean-toolchain', 'eval/mutants/lake-manifest.json', 'eval/mutants/lean-toolchain', 'eval/score/lake-manifest.json', 'eval/score/lean-toolchain', 'examples/acme/lake-manifest.json', 'examples/acme/lean-toolchain', 'lake-manifest.json', 'lean-toolchain') }}-

      - name: Drop restored cheat and mutant logs
        if: always()
        run: rm -rf .lake/cheats .lake/mutants

      - name: Install elan if the cache has none (pinned, checked, retried)
        run: .github/scripts/install-elan.sh

      - name: Cache key and folder of the pinned bubblewrap .deb
        id: bwrap
        run: .github/scripts/install-bubblewrap.sh --cache-key >> "$GITHUB_OUTPUT"

      - name: Restore the pinned bubblewrap .deb (saved at the end of a job that downloaded it)
        uses: actions/cache@v4
        with:
          path: ${{ steps.bwrap.outputs.dir }}
          key: ${{ steps.bwrap.outputs.key }}

      - name: Install bubblewrap (sandbox for lake comparator)
        run: |
          .github/scripts/install-bubblewrap.sh
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; bwrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install the Lean toolchains from lean-toolchain (retried; no download on a cache hit)
        run: .github/scripts/install-toolchains.sh

      - name: Build core and gate
        run: lake build

      - name: Make ShellCheck and PyYAML available for the gate suites
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          fi
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml

      - name: Gate suite shard ${{ matrix.shard }} of 3
        run: python3 -I .github/scripts/gate-tests.py run --shard "${{ matrix.shard }}/3" --out "$RUNNER_TEMP/gate-tests-${{ matrix.shard }}"

      - name: Upload gate suite execution records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-tests-${{ matrix.shard }}
          path: ${{ runner.temp }}/gate-tests-${{ matrix.shard }}
          if-no-files-found: error
          overwrite: true

  # Same skip rule as checks. Each shard pays its own Lean setup and runs the
  # residue `mitos-gate cheats --shard k/3` assigns. N is 3: on the cache-hit
  # corpus of run 43679668897 the slowest third was 264s, and a fourth runner
  # saved about 30s after setup.
  cheat-shard:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.action != 'labeled' &&
       github.event.action != 'unlabeled')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      LAKE_NO_CACHE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Restore only. #168's setup action replaces these inline steps.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan
            .lake
            core/.lake
            examples/acme/.lake
            eval/score/.lake
            eval/mutants/.lake
          key: lean-${{ hashFiles('core/lake-manifest.json', 'eval/diff/lake-manifest.json', 'eval/diff/lean-toolchain', 'eval/mutants/lake-manifest.json', 'eval/mutants/lean-toolchain', 'eval/score/lake-manifest.json', 'eval/score/lean-toolchain', 'examples/acme/lake-manifest.json', 'examples/acme/lean-toolchain', 'lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          restore-keys: lean-${{ hashFiles('core/lake-manifest.json', 'eval/diff/lake-manifest.json', 'eval/diff/lean-toolchain', 'eval/mutants/lake-manifest.json', 'eval/mutants/lean-toolchain', 'eval/score/lake-manifest.json', 'eval/score/lean-toolchain', 'examples/acme/lake-manifest.json', 'examples/acme/lean-toolchain', 'lake-manifest.json', 'lean-toolchain') }}-

      - name: Drop restored cheat and mutant logs
        if: always()
        run: rm -rf .lake/cheats .lake/mutants

      - name: Install elan if the cache has none (pinned, checked, retried)
        run: .github/scripts/install-elan.sh

      - name: Cache key and folder of the pinned bubblewrap .deb
        id: bwrap
        run: .github/scripts/install-bubblewrap.sh --cache-key >> "$GITHUB_OUTPUT"

      - name: Restore the pinned bubblewrap .deb (saved at the end of a job that downloaded it)
        uses: actions/cache@v4
        with:
          path: ${{ steps.bwrap.outputs.dir }}
          key: ${{ steps.bwrap.outputs.key }}

      - name: Install bubblewrap (sandbox for lake comparator)
        run: |
          .github/scripts/install-bubblewrap.sh
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; bwrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install the Lean toolchains from lean-toolchain (retried; no download on a cache hit)
        run: .github/scripts/install-toolchains.sh

      - name: Build core and gate
        run: lake build

      - name: Cheat shard ${{ matrix.shard }} of 3
        run: |
          set -euo pipefail
          rm -rf .lake/cheats
          mkdir -p .lake/cheats
          # Keep the status and still print the table. A pipe would swallow it.
          status=0
          .lake/build/bin/mitos-gate cheats --jobs 4 --timeout 600 --shard "${{ matrix.shard }}/3" \
            > .lake/cheats/table.txt || status=$?
          printf '%s\n' "$status" > .lake/cheats/shard-exit
          if [ "$status" -eq 0 ] && [ ! -s .lake/cheats/shard-cases ]; then
            echo "shard-cases is empty, so the shard did not record the names it ran" >&2
            status=1
          fi
          cat .lake/cheats/table.txt
          exit "$status"

      - name: Upload shard logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cheat-shard-logs-${{ matrix.shard }}
          path: .lake/cheats/
          if-no-files-found: error
          overwrite: true

  # Runs when checks or a shard failed, so a failed or cancelled shard becomes
  # a failed prove. Skipped on a label event, where gate reads an earlier run.
  prove:
    needs: [checks, gate-tests, cheat-shard]
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.action != 'labeled' &&
        github.event.action != 'unlabeled'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: cheat-shard-logs-*
          path: shards

      - uses: actions/download-artifact@v4
        with:
          name: mitos-gate-bin
          path: gate-bin

      - uses: actions/download-artifact@v4
        with:
          pattern: gate-tests-*
          path: gate-test-logs

      - name: Cheat corpus is rejected (mitos-gate cheats, runs in parallel)
        env:
          CHECKS: ${{ needs.checks.result }}
          SHARDS: ${{ needs.cheat-shard.result }}
          GATE_TESTS: ${{ needs.gate-tests.result }}
        run: |
          set -euo pipefail
          python3 -I .github/scripts/gate-tests.py verify --job "$GATE_TESTS" --shards 3 \
            gate-test-logs/gate-tests-0 gate-test-logs/gate-tests-1 gate-test-logs/gate-tests-2
          chmod +x gate-bin/mitos-gate
          gate-bin/mitos-gate cheats aggregate \
            --checks "$CHECKS" --shards "$SHARDS" --merged merged \
            shards/cheat-shard-logs-0 shards/cheat-shard-logs-1 shards/cheat-shard-logs-2

      - name: Upload the merged cheat logs
        uses: actions/upload-artifact@v4
        with:
          name: cheat-logs
          path: merged/
          if-no-files-found: error
          overwrite: true

  # The only required check. No needs and no job if: a skipped required check
  # counts as passed. It fails unless the spec label holds and prove succeeded,
  # including when a shard failed, was cancelled, or was skipped on a run that
  # should have run the corpus.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The labels route fails closed
        env:
          GH_TOKEN: ${{ github.token }}
          # pull-requests: read covers this route for a pull request. On a push
          # there is no event PR, so the call uses an existing one.
          LIVE_PR: ${{ github.event.pull_request.number || 125 }}
        run: .github/scripts/ci-trust.test.sh --live

      - name: Spec changes need the spec-approved label, and prove succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/ci-trust.sh aggregate

  # A fork's token cannot comment; its scorecard stays in the checks job's summary.
  # The comment follows prove, not the label: a spec PR labelled after its push
  # still gets one.
  scorecard-comment:
    needs: prove
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.prove.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    concurrency:
      group: scorecard-comment-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scorecard

      - name: Post the scorecard, or update the one posted earlier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- mitos-scorecard -->'
          { echo "$marker"; cat scorecard.md; echo; echo "_Head ${SHA}, from the \`checks\` job._"; } > body.md
          ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            jq -n --rawfile body body.md '{body: $body}' \
              | gh api -X PATCH "repos/$REPO/issues/comments/$id" --input - --jq .html_url
          else
            jq -n --rawfile body body.md '{body: $body}' \
              | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - --jq .html_url
          fi
