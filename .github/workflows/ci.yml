name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

# No concurrency group. A group cancels by arrival order, not by head: a re-run or a late-created
# run of an old head joined the PR's group and cancelled the current head's run (#97).
jobs:
  # A fork PR's token cannot cancel runs, so forks skip it and their old runs finish.
  cancel-superseded:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Cancel this branch's superseded runs, or only this run when the PR is closed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          CONFIRM_SECONDS: 10
        run: |
          # cancel-superseded-body
          set -euo pipefail
          read_unfinished_runs() {
            read -r wf own_head branch < <(gh api "repos/$REPO/actions/runs/$RUN_ID" \
              --jq '"\(.workflow_id) \(.head_sha) \(.head_branch)"')
            runs="$RUNNER_TEMP/unfinished-runs"
            gh api --paginate -X GET "repos/$REPO/actions/workflows/$wf/runs" \
              -f event=pull_request -f branch="$branch" -f per_page=100 \
              | jq -r --arg branch "$branch" --arg repo "$REPO" '.workflow_runs[]
                  | select(.status != "completed" and .event == "pull_request"
                      and .head_branch == $branch and .head_repository.full_name == $repo)
                  | "\(.id) \(.head_sha)"' > "$runs"
            echo "Unfinished runs of $branch (run id, head):"; cat "$runs"
          }
          read_pr_state_and_head() { gh api "repos/$REPO/pulls/$PR" --jq '"\(.state) \(.head.sha)"'; }
          read_unfinished_runs
          stale_runs() {
            awk -v h="$1" -v own="$own_head" '$2 != h { n++ } END { exit !(n || own != h) }' "$runs"
          }
          pr=$(read_pr_state_and_head); confirmed=
          for _ in 1 2 3; do
            if [ "${pr%% *}" = open ] && ! stale_runs "${pr#* }"; then
              echo "Every unfinished run is at the current head ${pr#* }."; exit 0
            fi
            sleep "$CONFIRM_SECONDS"
            next=$(read_pr_state_and_head)
            if [ "$next" = "$pr" ]; then confirmed=1; break; fi
            echo "The PR moved from $pr to $next between two reads; reading again."
            pr=$next
          done
          if [ -z "$confirmed" ]; then echo "::notice::The PR kept changing; no run cancelled."; exit 0; fi
          state=${pr%% *} head=${pr#* }

          cancel_when_pr_closed() {
            open_heads=$(gh api -X GET "repos/$REPO/pulls" -f state=open \
              -f head="${REPO%%/*}:$branch" -f per_page=100 --jq '.[].head.sha')
            if grep -qxF "$own_head" <<< "$open_heads"; then
              echo "PR #$PR is $state, and an open PR from $branch is at $own_head; this run goes on."
              exit 0
            fi
            echo "Cancel this run ($RUN_ID): PR #$PR is $state; no other run is judged."
            gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/cancel" --silent
            exit 0
          }
          not_started() {
            case "$1" in
              queued|pending|waiting|requested) ;;
              *) return 1 ;;
            esac
            [ "$2" -eq 0 ]
          }
          cancel_refusal_is_harmless() {
            local err="$1" id="$2" status jobs
            status=$(gh api "repos/$REPO/actions/runs/$id" --jq .status) || return 1
            # A run that finished after the listing cannot be cancelled any more.
            if [ "$status" = completed ]; then return 0; fi
            if [[ "$err" != *"has not been queued yet"* || "$err" != *"HTTP 409"* ]]; then
              return 1
            fi
            jobs=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq .total_count) || return 1
            if not_started "$status" "$jobs"; then
              echo "::notice::Run $id is not started (status $status, $jobs jobs). GitHub refused the cancel with HTTP 409. Leaving the run."
              return 0
            fi
            return 1
          }
          cancel_runs_whose_head_differs() {
            failed=0
            while read -r id sha <&3; do
              if [ "$sha" = "$head" ] || [ "$id" = "$RUN_ID" ]; then continue; fi
              echo "Cancel run $id: its head $sha is not the current head $head."
              if ! err=$(gh api -X POST "repos/$REPO/actions/runs/$id/cancel" --silent 2>&1); then
                printf '%s\n' "$err"
                if ! cancel_refusal_is_harmless "$err" "$id"; then failed=1; fi
              fi
            done 3< "$runs"
            if [ "$own_head" != "$head" ]; then
              echo "Cancel this run ($RUN_ID): its head $own_head is not the current head $head."
              gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/cancel" --silent
            fi
            exit "$failed"
          }
          if [ "$state" != open ]; then cancel_when_pr_closed; fi
          cancel_runs_whose_head_differs
          # end-cancel-superseded-body

  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pr-state.sh, watch-github.sh and the files they source run gh only as gh api in their wrappers, and never name GraphQL
        run: .claude/scripts/gh-api-rest.test.sh

      - name: hook-state.sh and origin-repo.sh name bash with a shebang
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          fi
          .claude/scripts/sourced-bash.test.sh

      - name: Every plan row that links an issue has a task file with a design, or is listed as pending
        run: .claude/scripts/plan-tasks.test.sh

      - name: A never-started jobless run does not fail cancel-superseded
        run: .github/scripts/cancel-superseded.test.sh

      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
            core/.lake
          key: lean-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lean-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Install elan if the cache has none (pinned, checked, retried)
        run: .github/scripts/install-elan.sh

      - name: Cache key and folder of the pinned bubblewrap .deb
        id: bwrap
        run: .github/scripts/install-bubblewrap.sh --cache-key >> "$GITHUB_OUTPUT"

      - name: Restore the pinned bubblewrap .deb (saved at the end of a job that downloaded it)
        uses: actions/cache@v4
        with:
          path: ${{ steps.bwrap.outputs.dir }}
          key: ${{ steps.bwrap.outputs.key }}

      - name: Install bubblewrap (sandbox for lake comparator)
        run: |
          .github/scripts/install-bubblewrap.sh
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; bwrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install the Lean toolchains from lean-toolchain (retried; no download on a cache hit)
        run: .github/scripts/install-toolchains.sh

      - name: Build core and gate
        run: lake build

      - name: land-decide.sh records each outcome and holds no key
        run: .github/scripts/land-decide.test.sh

      - name: Every gate shell test passes (gate/*-test.sh)
        run: |
          failed=
          for t in gate/*-test.sh; do
            echo "== $t"
            "$t" || failed="$failed $t"
          done
          if [ -n "$failed" ]; then echo "::error::these gate shell tests failed:$failed"; exit 1; fi

      - name: Run-log lines are append-only, one record per (task, role, attempt)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base "origin/$BASE_REF" HEAD)
            dir="$RUNNER_TEMP/runlog-base"
            rm -rf "$dir" && mkdir -p "$dir/ops/runs"
            if git cat-file -e "$base:ops/runs" 2>/dev/null; then
              git archive "$base" ops/runs | tar -x -C "$dir"
            fi
            lake exe mitos-gate runlog --base "$dir/ops/runs" --head ops/runs
          else
            lake exe mitos-gate runlog --head ops/runs
          fi

      - name: Import rule (core imports Init, Std, Mitos.*; the spec never imports implementations)
        run: lake exe mitos-gate imports

      - name: statements.lock header matches MitosGate.Lock.header
        run: gate/lock-header-test.sh

      - name: statements.lock matches the compiled core
        run: lake exe mitos-gate lock --check

      - name: Core has no sorry and only standard axioms (sandboxed kernel replay)
        run: cd core && lake check

      - name: Core implementation proves the approved Challenge
        run: |
          if [ -f core/Mitos/Proofs/Resolver.lean ]; then
            cd core && lake comparator --paranoid
          else
            echo "No implementation yet (core/Mitos/Proofs/Resolver.lean); Challenge not judged."
          fi

      - name: Example workspace builds
        run: cd examples/acme && lake build

      - name: Scorecard on the fixture (precision and recall per edge type against hand labels)
        run: |
          lake --dir eval/score build
          lake --dir eval/score exe mitos-score eval/fixtures/toy > "$RUNNER_TEMP/scorecard.md"
          cat "$RUNNER_TEMP/scorecard.md"
          cat "$RUNNER_TEMP/scorecard.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: ${{ runner.temp }}/scorecard.md

      - name: Honest toy plugin is accepted (gates 0-6, independent kernels)
        run: |
          lake exe mitos-gate accept --workspace examples/acme --plugin ToyRequire \
            --model Models.ToyRequire.model --paranoid

      - name: Model lint allowlist accepts and rejects each command kind
        run: lake exe mitos-lint-test

      - name: Cheat corpus is rejected (mitos-gate cheats, runs in parallel)
        run: |
          rm -rf .lake/cheats
          start=$SECONDS
          set +e
          lake exe mitos-gate cheats
          status=$?
          set -e
          echo "mitos-gate cheats: $((SECONDS - start)) s on $(nproc) vCPU, $(free -g | awk '/^Mem:/ {print $2}') GiB"
          exit "$status"

      - name: Spec changes need the spec-approved label
        if: github.event_name == 'pull_request'
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'spec-approved') }}
        run: |
          changed=$(git diff --no-renames --name-only -z "origin/${{ github.base_ref }}...HEAD" \
            | grep -zE '(^|/)(statements|models)\.lock$|^core/Challenge/|^core/comparator\.json$|^core/Mitos/Core(/|\.lean$|$)' \
            | tr '\0' '\n' || true)
          if [ -n "$changed" ] && [ "$APPROVED" != "true" ]; then
            echo "These spec files changed without the spec-approved label:"; echo "$changed"; exit 1
          fi

      - name: Upload cheat logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cheat-logs
          path: .lake/cheats/
          if-no-files-found: ignore

  # A fork's token cannot comment; its scorecard stays in the gate job's summary.
  scorecard-comment:
    needs: gate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    concurrency:
      group: scorecard-comment-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scorecard

      - name: Post the scorecard, or update the one posted earlier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- mitos-scorecard -->'
          { echo "$marker"; cat scorecard.md; echo; echo "_Head ${SHA}, from the \`gate\` job._"; } > body.md
          ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            jq -n --rawfile body body.md '{body: $body}' \
              | gh api -X PATCH "repos/$REPO/issues/comments/$id" --input - --jq .html_url
          else
            jq -n --rawfile body body.md '{body: $body}' \
              | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - --jq .html_url
          fi
