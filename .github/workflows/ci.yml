name: ci

# Throwaway probe of the concurrency block of PR #90 at c3441ba (copied verbatim below). The job is a
# sleep, so it costs nothing and cannot stand in for the real gate. This branch is never merged.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: >-
    ci-${{ github.event_name == 'pull_request'
    && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Sleep so the order of events can be read
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "event=$EVENT action=$ACTION head=$HEAD_SHA"
          sleep 200
