name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      LAKE_NO_CACHE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Drop restored cheat and mutant logs
        if: always()
        run: rm -rf .lake/cheats .lake/mutants

      - name: Resources before the heavy steps
        run: .github/scripts/sample-resources.sh before

      - run: lake build
      - run: lake exe mitos-gate imports
      - run: lake exe mitos-gate lock --check
      - run: cd core && lake check

      - name: Core implementation proves the approved Challenge (paranoid)
        run: |
          if [ -f core/Mitos/Proofs/Resolver.lean ]; then
            cd core && lake comparator --paranoid
          else
            echo "No implementation yet (core/Mitos/Proofs/Resolver.lean); Challenge not judged."
          fi

      - run: cd examples/acme && lake build
      - name: Every plugin in examples/acme/Plugins is accepted, and its committed record is the one the gate writes
        run: .github/scripts/accept-plugins.sh --record
      - run: lake exe mitos-gate cheats --jobs 4

      - name: Build the mutant runner
        if: ${{ !cancelled() }}
        run: lake --dir eval/mutants build

      - name: Mutation testing (paranoid)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          .github/scripts/sample-resources.sh during &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          status=0
          lake --dir eval/mutants exe mitos-mutants --paranoid | tee "$RUNNER_TEMP/mutants.txt" \
            || status=$?
          { echo '### Mutation testing'; echo '```'; cat "$RUNNER_TEMP/mutants.txt"; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: The numbers of main's newest nightly that has them, as the scorecard's baseline
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/nightly-baseline.sh

      - name: Scorecard of every fixture, its diff against main's numbers, and the most derivations any repo-level edge has
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          lake --dir eval/score build
          base=()
          if [ -f "$RUNNER_TEMP/base/numbers.tsv" ]; then base=("$RUNNER_TEMP/base/numbers.tsv"); fi
          status=0
          lake --dir eval/score exe mitos-score --all eval/fixtures "${base[@]}" > "$RUNNER_TEMP/scorecard.md" || status=$?
          cat "$RUNNER_TEMP/scorecard.md" >> "$GITHUB_STEP_SUMMARY"
          [ "$status" -eq 0 ] || exit "$status"
          lake --dir eval/score exe mitos-score --numbers eval/fixtures > "$RUNNER_TEMP/numbers.part"
          mkdir -p "$RUNNER_TEMP/numbers"
          mv "$RUNNER_TEMP/numbers.part" "$RUNNER_TEMP/numbers/numbers.tsv"
          n=$(sed -n '/^Most derivations any repo-level edge has: /{s/^Most derivations any repo-level edge has: \([0-9][0-9]*\), .*/\1/p;q;}' "$RUNNER_TEMP/scorecard.md")
          if [ -n "$n" ]; then
            echo "Most derivations any repo-level edge has: $n"
            if grep -q '^\*\*Above [0-9][0-9]*: D1 reopens ' "$RUNNER_TEMP/scorecard.md"; then
              echo "::warning::a repo-level edge has $n derivations, above D1's threshold, so D1 is the owner's to reopen (plan/phase-2.md, Scope decisions)"
            fi
          elif ! grep -Fqx 'No fixture has a repo-level edge, so no derivations were counted.' "$RUNNER_TEMP/scorecard.md"; then
            echo "::error::the scorecard has no line that starts 'Most derivations any repo-level edge has: <n>, ', so this step and mitos-score --all disagree on its format"
            exit 1
          fi

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scorecard
          path: ${{ runner.temp }}/scorecard.md
          if-no-files-found: error

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scorecard-numbers
          path: ${{ runner.temp }}/numbers/numbers.tsv
          if-no-files-found: ignore

      - name: Resources at the end of the job
        if: always()
        run: .github/scripts/sample-resources.sh after

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cheat-logs
          path: .lake/cheats/
          if-no-files-found: ignore

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutant-logs
          path: .lake/mutants/
          if-no-files-found: ignore

  diff:
    runs-on: ubuntu-24.04
    env:
      LAKE_NO_CACHE: '1'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"

      - name: Go from eval/diff/.go-version (SHA256 pinned in install-go.sh, retried)
        run: .github/scripts/install-go.sh

      - name: The pins match their bytes, sum.golang.org and the reviewed licence sources
        run: eval/diff/check-pins.sh --online

      - name: Build eval/diff and run its selftest
        run: |
          lake --dir eval/diff build
          eval/diff/selftest.sh

      - name: Go rewrites the vendored outputs, then the differential run compares them with the plugin
        shell: bash
        run: |
          status=0
          lake --dir eval/diff exe mitos-diff eval/diff --refresh > "$RUNNER_TEMP/diff.md" || status=$?
          { echo '### Differential run (go.mod, refreshed with Go)'; cat "$RUNNER_TEMP/diff.md"; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Go printed the vendored bytes (the refresh left the tree clean)
        if: ${{ !cancelled() }}
        run: |
          moved=$(git status --porcelain --untracked-files=all -- eval/diff)
          if [ -n "$moved" ]; then
            printf '%s\n' "$moved"
            git diff --stat -- eval/diff
            echo "::error::Go $(cat eval/diff/.go-version) does not print the vendored module.json bytes"
            exit 1
          fi

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diff-report
          path: ${{ runner.temp }}/diff.md
          if-no-files-found: ignore

  resolve:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        # bash, not the default `bash -e`, adds pipefail: a failed API call must fail the job, not
        # resolve to an empty list that silently skips the canary.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newer_than() {
            [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]
          }
          pinned=$(sed 's|.*:||' lean-toolchain)
          releases=$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/leanprover/lean4/releases?per_page=100" \
            | jq -r '.[] | select(.draft | not) | .tag_name')
          stable=$(echo "$releases" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          rc=$(echo "$releases" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$' | sort -V | tail -n1 || true)
          if [ -n "$rc" ] && ! newer_than "${rc%-rc*}" "$stable"; then
            rc=""
          fi
          versions=$(printf '%s\n%s\n' "$stable" "$rc" | { grep -v -e '^$' -e "^$pinned\$" || true; } | jq -R . | jq -sc .)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          {
            echo "### Toolchain canary: versions to try"
            echo "- pinned: \`$pinned\`"
            echo "- newest stable: \`${stable:-none}\`"
            echo "- newest rc: \`${rc:-none}\`"
            echo "- trying: \`$versions\`"
          } >> "$GITHUB_STEP_SUMMARY"

  canary:
    name: canary (early warning) ${{ matrix.version }}
    needs: resolve
    if: needs.resolve.outputs.versions != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.resolve.outputs.versions) }}
    env:
      VERSION: ${{ matrix.version }}
      LAKE_NO_CACHE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Point the toolchain at the candidate (this checkout only)
        shell: bash
        run: |
          set +e
          .github/scripts/bump-lean.sh "$VERSION"
          code=$?
          set -euo pipefail
          git diff
          if [ "$code" -eq 3 ]; then
            printf '### canary %s: waiting for Mathlib'\''s %s tag\n' "$VERSION" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            printf '### canary %s: FAILED\nEarly warning, not a failure of main: an upgrade to %s breaks a check. Schedule the bump (docs/process.md, tripwires).\n' "$VERSION" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi

      - uses: ./.github/actions/setup

      - name: Update manifests for the candidate toolchain
        shell: bash
        run: |
          set +e
          .github/scripts/bump-lean.sh --lock >"$RUNNER_TEMP/bump-lock.txt"
          code=$?
          set -euo pipefail
          cat "$RUNNER_TEMP/bump-lock.txt"
          grep '^lock: ' "$RUNNER_TEMP/bump-lock.txt" | sed 's/^/### /' >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$code" -ne 0 ]; then
            printf '### canary %s: FAILED\nEarly warning, not a failure of main: an upgrade to %s breaks a check. Schedule the bump (docs/process.md, tripwires).\n' "$VERSION" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi

      - name: Resources before the checks
        run: .github/scripts/sample-resources.sh before

      - name: Run the checks on the candidate toolchain
        shell: bash
        run: |
          set -euo pipefail
          trap 'printf "### canary %s: FAILED\nEarly warning, not a failure of main: an upgrade to %s breaks a check. Schedule the bump (docs/process.md, tripwires).\n" "$VERSION" "$VERSION" >> "$GITHUB_STEP_SUMMARY"' ERR
          .github/scripts/sample-resources.sh during &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          lake build
          (cd core && lake check)
          if [ -f core/Mitos/Proofs/Resolver.lean ]; then (cd core && lake comparator); fi
          .github/scripts/accept-plugins.sh --no-record
          lake exe mitos-gate cheats --jobs 4
          lake --dir eval/mutants build
          lake --dir eval/mutants exe mitos-mutants
          echo "### canary $VERSION: passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Resources at the end of the job
        if: always()
        run: .github/scripts/sample-resources.sh after
