name: owner-ping

# Agents act through the owner's account, and GitHub never notifies a user of their own actions.
# So when an issue or PR is assigned to the owner, this job comments as github-actions[bot], a
# different actor, and its @mention notifies the owner (kitimark-mode skill, "Catching the user
# up"). pull_request_target runs this file from the default branch, so it also covers PRs stacked
# on another branch.
on:
  issues:
    types: [assigned]
  pull_request_target:
    types: [assigned]

permissions: {}

jobs:
  issue:
    if: >-
      github.event_name == 'issues' &&
      github.event.assignee.login == github.repository_owner &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - &ping
        name: Comment with the first line of the latest catch-up
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          line=$(gh api --paginate --slurp "repos/$REPO/issues/$NUMBER/comments?per_page=100" \
            | jq -r --arg owner "$OWNER" '
                def defuse:
                  gsub("@|\uff20|\ufe6b|\u0060|&commat;?|&#(0*64|x0*40|0*65312|x0*ff20|0*65131|x0*fe6b);?"; ""; "i")
                  as $s | if $s == . then . else $s | defuse end;
                [ .[][]
                  | select(.user.login == $owner)
                  | (.body // "") | (split("\n")[0] // "")
                  | gsub("[\\p{Cf}\u034f\u115f\u1160\u17b4\u17b5\u180b-\u180f\u3164\ufe00-\ufe0f\uffa0\\x{E0000}-\\x{E007F}\\x{E0100}-\\x{E01EF}]"; "")
                  | gsub("[\\p{Cc}\\p{Zl}\\p{Zp}\\p{Zs}]"; " ")
                  | sub("^[#* ]+"; "")
                  | select(test("^catch-up([:* ]|$)"; "i"))
                  | sub("^catch-up[:* ]*"; ""; "i") | sub("[* ]+$"; "") ]
                | last // empty
                | defuse | sub("^ +"; "") | .[0:200] | sub(" +$"; "")
                | select(. != "")
                | "\u0060\(.)\u0060"')
          if [ -n "$line" ]; then
            body=$(printf '<!-- owner-ping -->\n@%s this needs you: %s' "$OWNER" "$line")
          else
            body=$(printf '<!-- owner-ping -->\n@%s this needs you.' "$OWNER")
          fi
          gh api -X POST "repos/$REPO/issues/$NUMBER/comments" -f body="$body" --jq .html_url

  pr:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.assignee.login == github.repository_owner &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - *ping
