name: Keep PR branches up to date

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-prs
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-24.04
    steps:
      # Pushes made with GITHUB_TOKEN do not start CI, so rebased PRs would never get a `gate`
      # check. The updater pushes with a short-lived installation token of a GitHub App that is
      # installed on this repository only (contents, pull requests and workflows: write; workflows
      # because a rebase onto a main that changed .github/workflows pushes those files too).
      - name: Check the updater app is configured
        id: cfg
        env:
          APP_ID: ${{ vars.PR_UPDATER_APP_ID }}
          APP_KEY: ${{ secrets.PR_UPDATER_APP_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::warning::PR_UPDATER_APP_ID (variable) or PR_UPDATER_APP_KEY (secret) is not set; PR branches were not updated."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint a short-lived app token
        id: app
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PR_UPDATER_APP_ID }}
          private-key: ${{ secrets.PR_UPDATER_APP_KEY }}

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      # Skips draft, fork, labelled `no-auto-rebase` and non-`main`-based PRs, and every PR in a
      # GitHub stack (a stack is rebased only as a whole, by its owner or by GitHub when its bottom
      # PR merges). See `.github/scripts/rebase-prs.sh`.
      - name: Rebase open PRs onto main
        if: steps.cfg.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: .github/scripts/rebase-prs.sh
