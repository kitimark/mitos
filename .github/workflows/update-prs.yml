name: Keep PR branches up to date

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-prs
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-24.04
    # The app's private key is a secret of the `trusted` environment, whose deployment branch rule
    # admits only `main` (GitHub matches it against GITHUB_REF). So this job gets the key on a push
    # to main or a dispatch on main. GitHub refuses the job before its first step anywhere else: a
    # dispatch on another branch, and the same job in a PR's own workflow (refs/pull/N/merge) or
    # on a pushed branch. Each run leaves a deployment record in `trusted` with its ref and commit.
    environment: trusted
    steps:
      # Pushes made with GITHUB_TOKEN do not start CI, so rebased PRs would never get a `gate`
      # check.
      - name: Check the updater app is configured
        id: cfg
        env:
          APP_ID: ${{ vars.PR_UPDATER_APP_ID }}
          APP_KEY: ${{ secrets.PR_UPDATER_APP_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::warning::PR_UPDATER_APP_ID (variable) or PR_UPDATER_APP_KEY (secret of the trusted environment) is not set; PR branches were not updated."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint a short-lived app token
        id: app
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PR_UPDATER_APP_ID }}
          private-key: ${{ secrets.PR_UPDATER_APP_KEY }}

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Rebase open PRs onto main
        if: steps.cfg.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: .github/scripts/rebase-prs.sh
