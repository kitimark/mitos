name: land-protection

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [ci]
    types: [completed]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions: {}

jobs:
  read:
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
          github.event.comment.user.login == github.repository_owner))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: trusted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Mint an app token that can only read administration
        id: app
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.PR_UPDATER_APP_ID }}
          private-key: ${{ secrets.PR_UPDATER_APP_KEY }}
          permission-administration: read
      - name: Read main's protection
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: .github/scripts/land-protection.sh "$GITHUB_REPOSITORY" "$RUNNER_TEMP/land-protection"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: land-protection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/land-protection/read.json
          if-no-files-found: error
          retention-days: 1
