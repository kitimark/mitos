name: land

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [ci]
    types: [completed]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions: {}

env:
  LAND_MERGE: 'on'

jobs:
  decide:
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
          github.event.comment.user.login == github.repository_owner))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: land-decide
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      actions: read
    env:
      LAND_DASHBOARD: 43
    outputs:
      pr: ${{ steps.decide.outputs.pr }}
      head: ${{ steps.decide.outputs.head }}
      approval: ${{ steps.decide.outputs.approval }}
      digest: ${{ steps.decide.outputs.digest }}
      requires_spec: ${{ steps.decide.outputs.requires_spec }}
      answers: ${{ steps.decide.outputs.answers }}
    steps:
      - id: t0
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            .lake
            core/.lake
            examples/acme/.lake
            eval/score/.lake
            eval/mutants/.lake
          key: lean-${{ hashFiles('core/lake-manifest.json', 'eval/diff/lake-manifest.json', 'eval/diff/lean-toolchain', 'eval/mutants/lake-manifest.json', 'eval/mutants/lean-toolchain', 'eval/score/lake-manifest.json', 'eval/score/lean-toolchain', 'examples/acme/lake-manifest.json', 'examples/acme/lean-toolchain', 'lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          restore-keys: lean-${{ hashFiles('core/lake-manifest.json', 'eval/diff/lake-manifest.json', 'eval/diff/lean-toolchain', 'eval/mutants/lake-manifest.json', 'eval/mutants/lean-toolchain', 'eval/score/lake-manifest.json', 'eval/score/lean-toolchain', 'examples/acme/lake-manifest.json', 'examples/acme/lean-toolchain', 'lake-manifest.json', 'lean-toolchain') }}-
      - run: .github/scripts/install-elan.sh
      - run: .github/scripts/install-toolchains.sh
      - run: lake build mitos-gate
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          LAND_T0: ${{ steps.t0.outputs.at }}
          LAND_EVENT: ${{ github.event_name }}
          LAND_EVENT_HEAD: ${{ github.event.workflow_run.head_sha }}
          LAND_EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          LAND_EVENT_PR: ${{ github.event.issue.number }}
          LAND_EVENT_COMMENT: ${{ github.event.comment.id }}
        run: .github/scripts/land-decide.sh "$GITHUB_REPOSITORY" "$LAND_DASHBOARD" "$RUNNER_TEMP/land"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: land-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/land/record.json
          retention-days: 90
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: land-reads-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/land/reads
          retention-days: 7

  apply:
    needs: decide
    if: >-
      github.ref == 'refs/heads/main' && github.run_attempt == '1' &&
      needs.decide.outputs.pr != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The app's key is a secret of `trusted`, whose deployment branch rule admits only main (see
    # update-prs.yml).
    environment: trusted
    concurrency:
      group: land-apply
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      outcome: ${{ steps.apply.outputs.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Mint an app token that can only merge
        id: app
        if: env.LAND_MERGE == 'on'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.PR_UPDATER_APP_ID }}
          private-key: ${{ secrets.PR_UPDATER_APP_KEY }}
          permission-contents: write
          permission-workflows: write
      - name: Read the pull request and its conversation again, then merge pinned to the head
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
          LAND_MERGE_TOKEN: ${{ steps.app.outputs.token }}
          LAND_PR: ${{ needs.decide.outputs.pr }}
          LAND_HEAD: ${{ needs.decide.outputs.head }}
          LAND_APPROVAL: ${{ needs.decide.outputs.approval }}
          LAND_DIGEST: ${{ needs.decide.outputs.digest }}
          LAND_REQUIRES_SPEC: ${{ needs.decide.outputs.requires_spec }}
        run: .github/scripts/land-apply.sh "$GITHUB_REPOSITORY" "$RUNNER_TEMP/land-apply"

  report:
    needs: [decide, apply]
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.decide.result == 'success' &&
      ((needs.decide.outputs.answers != '' && needs.decide.outputs.answers != '[]') ||
        needs.decide.outputs.pr != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Answer each owner word whose answer changed
        env:
          GH_TOKEN: ${{ github.token }}
          LAND_ANSWERS: ${{ needs.decide.outputs.answers }}
          LAND_PR: ${{ needs.decide.outputs.pr }}
          LAND_HEAD: ${{ needs.decide.outputs.head }}
          LAND_APPLY_RESULT: ${{ needs.apply.result }}
          LAND_APPLIED: ${{ needs.apply.outputs.outcome }}
        run: .github/scripts/land-report.sh "$GITHUB_REPOSITORY"
