name: setup
description: Install elan and bubblewrap (the sandbox for lake comparator), and optionally restore the build cache.

inputs:
  cache:
    description: Restore and save the build cache keyed on lean-toolchain and lake-manifest.json.
    default: "true"

runs:
  using: composite
  steps:
    - name: Install elan (toolchain comes from lean-toolchain)
      shell: bash
      run: |
        curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
          | sh -s -- -y --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

    - name: Install bubblewrap
      shell: bash
      run: |
        sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; bwrap needs them.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.elan
          .lake
          core/.lake
        key: lean-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
        restore-keys: lean-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
