name: setup
description: Restore the build cache (optional), then install elan (only if the cache has none), the Lean toolchains, and bubblewrap (the sandbox for lake comparator).

inputs:
  cache:
    description: Restore and save the build cache. The key hashes every tracked lean-toolchain and lake-manifest.json outside eval/yaml-oracle.
    default: "true"

runs:
  using: composite
  steps:
    - if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.elan
          .lake
          core/.lake
          examples/acme/.lake
          eval/score/.lake
          eval/mutants/.lake
        key: lean-${{ hashFiles('core/lake-manifest.json', 'eval/diff/lake-manifest.json', 'eval/diff/lean-toolchain', 'eval/mutants/lake-manifest.json', 'eval/mutants/lean-toolchain', 'eval/score/lake-manifest.json', 'eval/score/lean-toolchain', 'examples/acme/lake-manifest.json', 'examples/acme/lean-toolchain', 'lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
        restore-keys: lean-${{ hashFiles('core/lake-manifest.json', 'eval/diff/lake-manifest.json', 'eval/diff/lean-toolchain', 'eval/mutants/lake-manifest.json', 'eval/mutants/lean-toolchain', 'eval/score/lake-manifest.json', 'eval/score/lean-toolchain', 'examples/acme/lake-manifest.json', 'examples/acme/lean-toolchain', 'lake-manifest.json', 'lean-toolchain') }}-

    - name: Install elan if the cache has none (pinned, checked, retried)
      shell: bash
      run: ${{ github.action_path }}/../../scripts/install-elan.sh

    - name: Cache key and folder of the pinned bubblewrap .deb
      id: bwrap
      shell: bash
      run: ${{ github.action_path }}/../../scripts/install-bubblewrap.sh --cache-key >> "$GITHUB_OUTPUT"

    - name: Restore the pinned bubblewrap .deb (saved at the end of a job that downloaded it)
      uses: actions/cache@v4
      with:
        path: ${{ steps.bwrap.outputs.dir }}
        key: ${{ steps.bwrap.outputs.key }}

    - name: Install bubblewrap
      shell: bash
      run: |
        ${{ github.action_path }}/../../scripts/install-bubblewrap.sh
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; bwrap needs them.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Install the Lean toolchains from lean-toolchain (retried; no download on a cache hit)
      shell: bash
      run: ${{ github.action_path }}/../../scripts/install-toolchains.sh
