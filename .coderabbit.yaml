# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: >-
  Be concise and concrete. Name the file, the line and the input that fails. No praise and no
  summary of what the code does. Start each finding with BLOCKING or FOLLOW-UP.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  suggested_reviewers: false
  poem: false
  abort_on_close: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "claude/.*"

  path_filters:
    - "!**/.lake/**"
    - "!**/lake-manifest.json"
    - "!reports/**"
    - "!research_notes/**"

  path_instructions:
    - path: "**"
      instructions: >-
        Start every finding with BLOCKING or FOLLOW-UP. A finding is BLOCKING when a run at the
        head or a line of the diff shows it: a cheat the gate accepts, a wrong result, a red
        check, a security check added or restored without the cheat case that pins it, or a doc
        line the PR made wrong. A check, cheat case, theorem or `expect` line that the diff
        removes or weakens is also BLOCKING, such as a deleted case, `reject@N` relaxed to
        `reject`, or a check that a conflict resolution drops, because weakening one is a spec
        change for the owner. A confidential key, token or ID in the diff is BLOCKING. A problem
        that `main` already has is BLOCKING only if the PR copies it, newly reaches it or is meant
        to fix it. Everything else is FOLLOW-UP; it goes into one follow-up issue and does not
        hold the PR. Before you raise a finding, check the open issues labelled `follow-up`. If
        one already tracks it, write "tracked in #N" and do not raise it again.
    - path: "**/*.lean"
      instructions: >-
        Lean 4 v4.35.0 with Lake, no Mathlib. Never suggest `sorry`, `admit`, `axiom`,
        `native_decide`, `partial`, `unsafe`, `implemented_by` or `extern` in core or plugin
        code. Trusted syntax layers stay structurally recursive so `decide` can evaluate them.
        Do not comment on proof style; the kernel checks proofs.
    - path: "core/Mitos/Core/**"
      instructions: >-
        Locked specification, pinned by statements.lock and approved by the owner with the
        `spec-approved` label. Check that each docstring states exactly what its definition or
        theorem says, flag any statement that became weaker or vacuous (for example a `Prop`
        that any resolver satisfies), and check that the adequacy theorems in Spec/Adequacy.lean
        still rule out the obvious wrong implementations.
    - path: "core/Challenge/**"
      instructions: >-
        The theorems an implementation must prove, judged by `lake comparator`. A change here is
        a spec change. Flag anything that makes a statement easier to prove than the matching
        Prop in core/Mitos/Core/Spec.
    - path: "core/Mitos/{Impl,Proofs}/**"
      instructions: >-
        Implementation and proofs, outside the lock. Correctness is the kernel's job. Review for
        clarity and for anything that would make `lake comparator --paranoid` or the mutant
        corpus (eval/mutants) pass for the wrong reason.
    - path: "gate/**"
      instructions: >-
        Trust infrastructure: the acceptance gate for untrusted, AI-written plugins. Review as
        an attacker. Look for any input that makes a gate accept what it should reject: lint
        bypasses (the lint must see what Lean's parser sees), sandbox escapes, failure paths
        that do not end in REJECTED, attribution to the wrong gate, and anything that fails
        open. Checks must fail closed. Name the input, plugin or mutant that the finding would
        let through.
    - path: "eval/**"
      instructions: >-
        Cheat corpus and mutant corpus. An `expect` file must never be weakened. Each cheat
        must still be rejected by the full gate at its expected gate, and each mutant must be
        refuted by the theorem its `expect` names. Name the input, plugin or mutant that the
        finding would let through.
    - path: "ops/runs/**"
      instructions: >-
        Append-only run log, one JSON record per file. Compare with the merge base, not with
        earlier commits of the PR: a PR may rewrite the record files it added itself until it
        merges. Flag only a record file or a day-file line that the merge base has and this diff
        edits or deletes, a day file the PR adds, and a secret or an ID in a record. Do not
        review the numbers.
    - path: ".github/**"
      instructions: >-
        CI is the merge gate. Flag anything that skips, weakens or reorders a check, loosens
        the `spec-approved` label check or its path list, widens workflow permissions, uses
        untrusted input in a `run:` script, or pushes with a token that would not start CI.
    - path: "{CLAUDE.md,.claude/**}"
      instructions: >-
        Rules for AI agents working in this repository. Flag any change that lets an agent act
        on something docs/process.md reserves for the owner: spec approval, trust
        infrastructure, plans, anything outside the repository. Text under .claude/skills that
        is ported from pstack is upstream text; review only the adaptations.
    - path: "{docs,plan,tasks}/**"
      instructions: >-
        Process documentation. Flag statements that no longer match the code, CI or the lock
        files.

  tools:
    actionlint:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
    custom_checks:
      - name: "Review findings fixed or answered"
        mode: "warning"
        instructions: >-
          Read the review threads and the review comments on this PR, including findings posted
          outside the diff, which get no thread. A finding passes when a later commit on the PR
          fixes it and the fix is still present at the PR head, or when a reply explains why the
          code stays. A FOLLOW-UP finding also passes when a reply links the issue that tracks
          it. A BLOCKING finding does not pass on an issue link alone. Fail and name each
          finding that matches none of these. If you cannot tell whether a thread was answered,
          say so and do not fail.
