name = "mitos"
defaultTargets = ["mitos-gate"]

[[require]]
name = "mitos-core"
path = "core"

[[lean_lib]]
name = "MitosGate"
srcDir = "gate"

[[lean_exe]]
name = "mitos-gate"
srcDir = "gate"
root = "Main"
supportInterpreter = true
needs = ["mitos-core/+Mitos.Core:olean"]

[[lean_exe]]
name = "mitos-lint-test"
srcDir = "gate"
root = "LintTest"
supportInterpreter = true
