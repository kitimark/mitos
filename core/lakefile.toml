name = "mitos-core"
defaultTargets = ["MitosCore", "MitosImpl"]

[[lean_lib]]
name = "MitosCore"
globs = ["Mitos.Core", "Mitos.Core.+"]

[[lean_lib]]
name = "MitosImpl"
globs = ["Mitos.Impl.+", "Mitos.Proofs.+"]

# Not a default target: its `sorry` holes would fail `lake check`.
[[lean_lib]]
name = "MitosChallenge"
globs = ["Challenge.+"]
